# NOT PART OF THE AUTOMATED INSTALL.
# ollama.sh deploys Ollama via the otwld/ollama Helm chart (releases
# ollama-llama3 / ollama-qwen32b); nothing applies this file. It is kept only
# as a standalone manifest for manual smoke tests. Its GPU handling is kept in
# sync with the Helm values on purpose — applying a stale copy that requests
# nvidia.com/gpu would land the pod on an 8GB P4.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-deployment
  namespace: llms-ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama
    spec:
      nodeSelector:
        role: inference-node
      # inference-0 is tainted nvidia.com/gpu=present:NoSchedule to reserve it for
      # GPU work. Without this toleration the pod stays Pending.
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      runtimeClassName: nvidia
      containers:
        - name: ollama
          image: registry.container-registry.svc.cluster.local:5000/ollama/ollama:0.15.6
          ports:
            - containerPort: 11434
          env:
            - name: OLLAMA_FLASH_ATTENTION
              value: "true"
            - name: OLLAMA_KV_CACHE_TYPE
              value: "f16"
            - name: OLLAMA_NUM_CTX
              value: "4096"
            - name: OLLAMA_KEEP_ALIVE
              value: "-1"
            - name: OLLAMA_NUM_PARALLEL
              value: "1"
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "2"
            - name: OLLAMA_GPU_OVERHEAD
              value: "2147483648"
          # Pin the V100 by UUID rather than requesting nvidia.com/gpu: the
          # node's three GPUs (1x V100 32GB, 2x P4 8GB) are advertised as one
          # fungible resource, so a generic request can land on an 8GB card.
          # ConfigMap is created by ollama.sh from the node label.
          envFrom:
            - configMapRef:
                name: ollama-gpu-pin-v100
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama
      volumes:
        - name: ollama-data
          persistentVolumeClaim:
            claimName: ollama-pvc   
