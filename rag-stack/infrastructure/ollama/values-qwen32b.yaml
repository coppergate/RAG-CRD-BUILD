# values-qwen32b.yaml — GPU Ollama for qwen3:32b executor (formerly qwen2.5:32b)
# Deployed on inference-0 alongside ollama-llama3.
# 32B model (Q4_K_M ~19GB VRAM) — keep MAX_LOADED_MODELS=1 to avoid VRAM
# contention when the llama3 pod is also resident on the same GPU.
# All GPU models are seeded into this PVC for flexible routing.

replicaCount: 1

image:
  repository: registry.container-registry.svc.cluster.local:5000/ollama/ollama
  pullPolicy: IfNotPresent
  tag: ""

namespaceOverride: "llms-ollama"

service:
  enabled: false

ollama:
  port: 11434

  gpu:
    # Deliberately FALSE — do not re-enable without reading the note below.
    #
    # inference-0 holds a MIXED GPU pool: 1x Tesla V100 32GB (sm_70) and
    # 2x Tesla P4 8GB (sm_61), all three advertised as a single fungible
    # 'nvidia.com/gpu' resource. Requesting nvidia.com/gpu here would let the
    # scheduler hand this pod any of the three; two of them cannot hold a 32B
    # model (~19GB Q4_K_M) in 8GB of VRAM.
    #
    # GPU node-affinity is NOT a workaround: GFD models a mixed node as a
    # single product/memory/compute triple and currently reports the P4
    # (product=Tesla-P4, memory=7680, compute 6.1) even with MIG_STRATEGY=none,
    # so nvidia.com/gpu.* labels cannot be trusted to find the V100.
    #
    # Instead this pod pins the V100 by UUID via NVIDIA_VISIBLE_DEVICES (see
    # extraEnv below), which is injected by the container runtime hook and was
    # verified to expose exactly one card to an unprivileged pod.
    enabled: false

  models:
    pull: []
    run: []
    create: []
    clean: false

  insecure: false

volumes:
  - name: registry-ca
    configMap:
      name: registry-ca-cm

volumeMounts:
  - name: registry-ca
    mountPath: /etc/ssl/certs/ca-certificates.crt
    subPath: ca.crt

extraEnv:
  - name: OLLAMA_HOST
    value: "0.0.0.0:11434"
  - name: OLLAMA_REGISTRY_INSECURE
    value: "0"
  - name: SSL_CERT_FILE
    value: "/etc/ssl/certs/ca-certificates.crt"
  - name: OLLAMA_FLASH_ATTENTION
    value: "true"
  - name: OLLAMA_KV_CACHE_TYPE
    value: "f16"
  # Larger context for qwen2.5:32b — it supports up to 128k but 8192 is a
  # practical default that fits comfortably within 32GB VRAM alongside the
  # llama3 pod's steady-state usage.
  - name: OLLAMA_NUM_CTX
    value: "8192"
  - name: OLLAMA_KEEP_ALIVE
    value: "-1"
  - name: OLLAMA_NUM_PARALLEL
    value: "1"
  # Keep to 1: qwen2.5:32b (~20GB) + a second model would exceed 32GB when
  # ollama-llama3 is also resident on the same GPU node.
  - name: OLLAMA_MAX_LOADED_MODELS
    value: "1"
  - name: OLLAMA_GPU_OVERHEAD
    value: "2147483648"

# GPU pinning. Supplies NVIDIA_VISIBLE_DEVICES (the V100 UUID) and
# NVIDIA_DRIVER_CAPABILITIES. The ConfigMap is generated by ollama.sh from the
# hierocracy.home/gpu-v100-uuid node label, so no UUID is hardcoded in the repo.
# Delivered via extraEnvFrom rather than extraEnv because Helm replaces whole
# lists on merge — an index-based --set override would be silently fragile.
extraEnvFrom:
  - configMapRef:
      name: ollama-gpu-pin-v100

# Required so the container runtime honours NVIDIA_VISIBLE_DEVICES. Talos sets
# containerd default_runtime_name=nvidia, but naming it here is explicit and
# survives a change to that default.
runtimeClassName: "nvidia"

persistentVolume:
  enabled: true
  accessModes:
    - ReadWriteMany
  size: 100Gi
  storageClass: "rook-cephfs"
  volumeMode: "Filesystem"

nodeSelector:
  role: inference-node

# inference-0 is tainted nvidia.com/gpu=present:NoSchedule so only GPU workloads
# land there (scripts/setup-node-labels.sh). This pod qualifies — it pins the V100.
# nodeSelector states intent; the toleration is what gets past the taint. Both
# are needed.
tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule

updateStrategy:
  type: "Recreate"

terminationGracePeriodSeconds: 120

livenessProbe:
  enabled: true
  path: /
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
  successThreshold: 1

readinessProbe:
  enabled: true
  path: /
  initialDelaySeconds: 30
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 6
  successThreshold: 1
