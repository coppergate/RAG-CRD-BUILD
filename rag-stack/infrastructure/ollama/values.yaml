# Default values for ollama-helm.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- Number of replicas
replicaCount: 1

# Knative configuration
knative:
  # -- Enable Knative integration
  enabled: false
  # -- Knative service container concurrency
  containerConcurrency: 0
  # -- Knative service timeout seconds
  timeoutSeconds: 300
  # -- Knative service response start timeout seconds
  responseStartTimeoutSeconds: 300
  # -- Knative service idle timeout seconds
  idleTimeoutSeconds: 300
  # -- Knative service annotations
  annotations: { }

# Docker image
image:
  # -- Docker image registry
  repository: hierophant.hierocracy.home:5000/ollama/ollama

  # -- Docker pull policy
  pullPolicy: IfNotPresent

  # -- Docker image tag, overrides the image tag whose default is the chart appVersion.
  tag: ""

# -- Docker registry secret names as an array
imagePullSecrets: [ ]

# -- String to partially override template  (will maintain the release name)
nameOverride: ""

# -- String to fully override template
fullnameOverride: ""

# -- String to fully override namespace
namespaceOverride: "llms-ollama"

service:
  enabled: false

# Ollama parameters
ollama:
  # Port Ollama is listening on
  port: 11434

  gpu:
    # -- Enable GPU integration
    # TRUE as of 2026-09-13. This was deliberately false for the mixed pool:
    # inference-0 held 1x V100 32GB (sm_70) + 2x Tesla P4 8GB (sm_61) advertised
    # as one indistinguishable nvidia.com/gpu, so requesting the resource could
    # hand this pod an 8GB card that cannot load the 32B models seeded into its
    # PVC. The card was pinned by UUID via the ollama-gpu-pin-v100 ConfigMap
    # instead, with no resource request at all.
    #
    # The P4s are gone; the node holds two identical V100 32GB cards. A plain
    # request is now both correct and strictly better — allocatable is 2, so
    # this pod and ollama-qwen32b land on SEPARATE cards rather than sharing
    # one, and the scheduler accounts for the allocation so nothing can
    # double-book. History: EXTERNAL-NODE-SETUP.md historical appendix.
    enabled: true

    # -- Enable DRA GPU integration
    # If enabled, it will use DRA instead of Device Driver Plugin and create a ResourceClserviceaim and GpuClaimParameters
    draEnabled: false

    # -- DRA GPU DriverClass
    draDriverClass: "gpu.nvidia.com"

    # -- Existing DRA GPU ResourceClaim Template
    draExistingClaimTemplate: ""

    # -- GPU type: 'nvidia' or 'amd'
    # If 'ollama.gpu.enabled', default value is nvidia
    # If set to 'amd', this will add 'rocm' suffix to image tag if 'image.tag' is not override
    # This is due cause AMD and CPU/CUDA are different images
    type: 'nvidia'

    # -- Specify the number of GPU
    # If you use MIG section below then this parameter is ignored
    # ONE card. Do not raise this: there are exactly 2 on the node and
    # ollama-qwen32b needs the other. Two cards to one pod would only help a
    # tensor-parallel runtime, and nvidia-smi topo -m reports SYS between them
    # (no NVLink, cross-socket), so that would be a poor trade here anyway.
    number: 1

    # -- only for nvidia cards; change to (example) 'nvidia.com/mig-1g.10gb' to use MIG slice
    nvidiaResource: "nvidia.com/gpu"
    # nvidiaResource: "nvidia.com/mig-1g.10gb" # example
    # If you want to use more than one NVIDIA MIG you can use the following syntax (then nvidiaResource is ignored and only the configuration in the following MIG section is used)

    mig:
      # -- Enable multiple mig devices
      # If enabled you will have to specify the mig devices
      # If enabled is set to false this section is ignored
      enabled: false

      # -- Specify the mig devices and the corresponding number
      devices: { }
      #        1g.10gb: 1
      #        3g.40gb: 1

  models:
    # -- List of models to pull at container startup
    # The more you add, the longer the container will take to start if models are not present
    # pull:
    #  - llama2
    #  - mistral
    pull: [ ]

    # -- List of models to load in memory at container startup
    # run:
    #  - llama2
    #  - mistral
    run: [ ]

    # -- List of models to create at container startup, there are two options
    # 1. Create a raw model
    # 2. Load a model from configMaps, configMaps must be created before and are loaded as volume in "/models" directory.
    # create:
    #  - name: llama3.1-ctx32768
    #    configMapRef: my-configmap
    #    configMapKeyRef: configmap-key
    #  - name: llama3.1-ctx32768
    #    template: |
    #      FROM llama3.1
    #      PARAMETER num_ctx 32768
    create: [ ]

    # -- Automatically remove models present on the disk but not specified in the values file
    clean: false

  # -- Add insecure flag for pulling at container startup
  insecure: false

  # -- Override ollama-data volume mount path, default: "/root/.ollama"
  mountPath: ""

# Service account
# ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
serviceAccount:
  # -- Specifies whether a service account should be created
  create: true

  # -- Automatically mount a ServiceAccount's API credentials?
  automount: true

  # -- Annotations to add to the service account
  annotations: { }

  # -- The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# -- Map of annotations to add to the pods
podAnnotations: { }

# -- Map of labels to add to the pods
podLabels: { }

# -- Pod Security Context
podSecurityContext: { }
# fsGroup: 2000

# -- Priority Class Name
priorityClassName: ""

# -- Container Security Context
securityContext: { }
  # capabilities:
  #  drop:
  #   - ALL
  # readOnlyRootFilesystem: true
# runAsNonRoot: true
# runAsUser: 1000

# -- Specify runtime class
# KEEP. Originally required so the runtime honoured the NVIDIA_VISIBLE_DEVICES
# injected by the (now deleted) ollama-gpu-pin-v100 ConfigMap. Still required
# with a plain nvidia.com/gpu request: the RuntimeClass is what selects the
# NVIDIA container runtime that maps the device and driver libraries into the
# container. Talos sets containerd default_runtime_name to nvidia already, but
# naming it here is explicit and survives that changing.
runtimeClassName: "nvidia"


# Configure Deployment
deployment:

  # -- Labels to add to the deployment
  labels: { }

# Configure the ingress resource that allows you to access the
ingress:
  # -- Enable ingress controller resource
  enabled: false

  # -- IngressClass that will be used to implement the Ingress (Kubernetes 1.18+)
  className: ""

  # -- Additional annotations for the Ingress resource.
  annotations: { }
    # kubernetes.io/ingress.class: traefik
  # kubernetes.io/ingress.class: nginx
  # kubernetes.io/tls-acme: "true"

  # The list of hostnames to be covered with this ingress record.
  hosts:
    - host: ollama.hierocracy.home
      paths:
        - path: /
          pathType: Prefix

  # --  The tls configuration for hostnames to be covered with this ingress record.
  tls: [ ]
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# Configure resource requests and limits
# ref: http://kubernetes.io/docs/user-guide/compute-resources/
resources:
  # -- Pod requests
  requests: { }
    # Memory request
    # memory: 4096Mi
  
  # CPU request
  # cpu: 2000m

  # -- Pod limit
  limits: { }
    # Memory limit
    # memory: 8192Mi
  
  # CPU limit
  # cpu: 4000m

# Configure extra options for liveness probe
# ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-probes/#configure-probes
livenessProbe:
  # -- Enable livenessProbe
  enabled: true

  # -- Request path for livenessProbe
  path: /

  # -- Initial delay seconds for livenessProbe
  initialDelaySeconds: 60

  # -- Period seconds for livenessProbe
  periodSeconds: 10

  # -- Timeout seconds for livenessProbe
  timeoutSeconds: 5

  # -- Failure threshold for livenessProbe
  failureThreshold: 6

  # -- Success threshold for livenessProbe
  successThreshold: 1

# Configure extra options for readiness probe
# ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-probes/#configure-probes
readinessProbe:
  # -- Enable readinessProbe
  enabled: true

  # -- Request path for readinessProbe
  path: /

  # -- Initial delay seconds for readinessProbe
  initialDelaySeconds: 30

  # -- Period seconds for readinessProbe
  periodSeconds: 5

  # -- Timeout seconds for readinessProbe
  timeoutSeconds: 3

  # -- Failure threshold for readinessProbe
  failureThreshold: 6

  # -- Success threshold for readinessProbe
  successThreshold: 1

# Configure autoscaling
autoscaling:
  # -- Enable autoscaling
  enabled: false

  # -- Number of minimum replicas
  minReplicas: 1

  # -- Number of maximum replicas
  maxReplicas: 100

  # -- CPU usage to target replica
  targetCPUUtilizationPercentage: 80

  # -- targetMemoryUtilizationPercentage: 80

# -- Additional volumes on the output Deployment definition.
volumes:
  - name: registry-ca
    configMap:
      name: registry-ca-cm
# NOTE: ollama-tls volume removed — Ollama does not honor OLLAMA_TLS_CERT/KEY env vars
# TLS will be revisited when migrating to vLLM

# -- Additional volumeMounts on the output Deployment definition.
volumeMounts:
  - name: registry-ca
    mountPath: /etc/ssl/certs/ca-certificates.crt
    subPath: ca.crt
# NOTE: ollama-tls mounts removed — Ollama does not honor OLLAMA_TLS_CERT/KEY env vars

# -- Additional arguments on the output Deployment definition.
extraArgs: [ ]

# -- Additional environments variables on the output Deployment definition.
# For extra OLLAMA env, please refer to https://github.com/ollama/ollama/blob/main/envconfig/config.go
extraEnv:
  # Ollama runs HTTP internally — TLS cert/key env vars are NOT honored by current Ollama.
  # Will be revisited when migrating to vLLM.
  - name: OLLAMA_HOST
    value: "0.0.0.0:11434"
  - name: OLLAMA_REGISTRY_INSECURE
    value: "0"
  - name: SSL_CERT_FILE
    value: "/etc/ssl/certs/ca-certificates.crt"
  - name: OLLAMA_FLASH_ATTENTION
    value: "true"
  - name: OLLAMA_KV_CACHE_TYPE
    value: "f16"
  # RENAMED 2026-09-13: was OLLAMA_NUM_CTX, which Ollama does not recognise —
  # 'ollama serve --help' on the mirrored ollama/ollama:0.15.6 lists
  # OLLAMA_CONTEXT_LENGTH only. The old 8192 was inert; Ollama fell back to its
  # own VRAM-derived default.
  #
  # 16384 on a now-dedicated 32GB V100. Budget, at f16 KV for an 8B-class model
  # (32 layers, 8 KV heads, 128 head_dim -> 128 KiB/token):
  #   16384 ctx -> 2 GiB KV per resident model, 4 GiB for the two allowed below
  #   2x ~5 GB weights + 4 GiB KV + 2 GiB GPU_OVERHEAD = ~16/32
  # Deliberately the same value as the executor rather than higher, even though
  # there is room: seed-models.sh also seeds qwen2.5:32b and qwen3:32b into this
  # PVC, so a routing change could make a 32B resident here. 16384 stays inside
  # the envelope if that happens; 32768 with two models would not.
  - name: OLLAMA_CONTEXT_LENGTH
    value: "16384"
  - name: OLLAMA_KEEP_ALIVE
    value: "-1"
  - name: OLLAMA_NUM_PARALLEL
    value: "1"
  # 2 resident 8B-class models (planner + a second for routing). Room exists for
  # 3 on a dedicated 32GB card, but see the context note above: a 32B can land
  # here, and 2 is the count that stays safe in that case.
  - name: OLLAMA_MAX_LOADED_MODELS
    value: "2"
  - name: OLLAMA_GPU_OVERHEAD
    value: "2147483648"
#  - name: OLLAMA_DEBUG
#    value: "1"

# -- Additionl environment variables from external sources (like ConfigMap)
# REMOVED 2026-09-13: the ollama-gpu-pin-v100 configMapRef. It supplied
# NVIDIA_VISIBLE_DEVICES (a specific card's UUID) and NVIDIA_DRIVER_CAPABILITIES
# so this pod could pin the V100 without requesting nvidia.com/gpu. With
# ollama.gpu.enabled=true the device plugin injects both, and ollama.sh no
# longer creates that ConfigMap — a stale reference here would leave the pod
# stuck in CreateContainerConfigError.
extraEnvFrom: []

# Enable persistence using Persistent Volume Claims
# ref: https://kubernetes.io/docs/concepts/storage/persistent-volumes/
persistentVolume:
  # -- Enable persistence using PVC
  enabled: true

  # -- Ollama server data Persistent Volume access modes
  # Must match those of existing PV or dynamic provisioner
  # Ref: http://kubernetes.io/docs/user-guide/persistent-volumes/
  accessModes:
    - ReadWriteMany

  # -- Ollama server data Persistent Volume annotations
  annotations: { }

  # -- If you'd like to bring your own PVC for persisting Ollama state, pass the name of the
  # created + ready PVC here. If set, this Chart will not create the default PVC.
  # Requires server.persistentVolume.enabled: true
  existingClaim: ""

  # -- Ollama server data Persistent Volume size
  size: 100Gi

  # -- Ollama server data Persistent Volume Storage Class
  # If defined, storageClassName: <storageClass>
  # If set to "-", storageClassName: "", which disables dynamic provisioning
  # If undefined (the default) or set to null, no storageClassName spec is
  # set, choosing the default provisioner.  (gp2 on AWS, standard on
  # GKE, AWS & OpenStack)
  storageClass: "rook-cephfs"

  # -- Ollama server data Persistent Volume Binding Mode
  # If defined, volumeMode: <volumeMode>
  # If empty (the default) or set to null, no volumeBindingMode spec is
  # set, choosing the default mode.
  volumeMode: "Filesystem"

  # -- Subdirectory of Ollama server data Persistent Volume to mount
  # Useful if the volume's root directory is not empty
  subPath: ""

  # -- Pre-existing PV to attach this claim to
  # Useful if a CSI auto-provisions a PV for you and you want to always
  # reference the PV moving forward
  volumeName: ""

# -- Node labels for pod assignment.
nodeSelector:
  role: inference-node

# -- Tolerations for pod assignment
# inference-0 is tainted nvidia.com/gpu=present:NoSchedule so only GPU workloads
# land there (scripts/setup-node-labels.sh). This pod qualifies — it pins the V100.
# nodeSelector states intent; the toleration is what gets past the taint. Both
# are needed.
tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule

# -- Affinity for pod assignment
affinity: { }

# -- Lifecycle for pod assignment (override ollama.models startup pull/run)
lifecycle: { }

# How to replace existing pods
updateStrategy:
  # -- Deployment strategy can be "Recreate" or "RollingUpdate". Default is Recreate
  type: "Recreate"

# -- Topology Spread Constraints for pod assignment
topologySpreadConstraints: { }

# -- Wait for a grace period
terminationGracePeriodSeconds: 120

# -- Init containers to add to the pod
initContainers: [ ]
# - name: startup-tool
#   image: alpine:3
#   command: [sh, -c]
#   args:
#     - echo init

# -- Use the host’s ipc namespace.
hostIPC: false

# -- Use the host’s pid namespace
hostPID: false

# -- Use the host's network namespace.
hostNetwork: false

# -- Extra K8s manifests to deploy
extraObjects: [ ]
#  - apiVersion: v1
#    kind: PersistentVolume
#    metadata:
#      name: aws-efs
#    data:
#      key: "value"
#  - apiVersion: scheduling.k8s.io/v1
#    kind: PriorityClass
#    metadata:
#      name: high-priority
#    value: 1000000
#    globalDefault: false
#    description: "This priority class should be used for XYZ service pods only."

# Test connection pods
tests:
  enabled: true
  # -- Labels to add to the tests
  labels: { }
  # -- Annotations to add to the tests
  annotations: { }