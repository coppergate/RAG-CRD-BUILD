apiVersion: v1
kind: ServiceAccount
metadata:
  name: rag-service-sa
  namespace: rag-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rag-service-role
  namespace: rag-system
rules:
- apiGroups: [""]
  resources: ["pods", "services", "endpoints"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rag-service-rolebinding
  namespace: rag-system
subjects:
- kind: ServiceAccount
  name: rag-service-sa
  namespace: rag-system
roleRef:
  kind: Role
  name: rag-service-role
  apiGroup: rbac.authorization.k8s.io
