apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qdrant-pvc
  namespace: rag-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  # NVMe-backed fast tier: Qdrant uses random small IO on HNSW segment files.
  # rook-ceph-block-fast provides ~0.1ms latency vs ~8ms on HDD-backed rook-ceph-block.
  storageClassName: rook-ceph-block-fast
