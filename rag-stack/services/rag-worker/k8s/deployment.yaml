apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-worker
  namespace: rag-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-worker
  template:
    metadata:
      labels:
        app: rag-worker
    spec:
      nodeSelector:
        role: storage-node
      serviceAccountName: rag-service-sa
      enableServiceLinks: false
      containers:
      - name: worker
        image: registry.container-registry.svc.cluster.local:5000/rag-worker:__VERSION__
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        startupProbe:
          httpGet:
            path: /healthz
            port: 8080
            scheme: HTTPS
          periodSeconds: 5
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
            scheme: HTTPS
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
            scheme: HTTPS
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 2
          failureThreshold: 3
        resources:
          requests:
            cpu: "300m"
            memory: "512Mi"
          limits:
            cpu: "2000m"
            memory: "2Gi"
        envFrom:
        - configMapRef:
            name: pulsar-topic-config
        env:
        - name: DB_CONN_STRING
          valueFrom:
            secretKeyRef:
              name: timescaledb-secret
              key: url
        - name: QDRANT_ADAPTER_URL
          value: "https://qdrant-adapter.rag-system.svc.cluster.local:8082"
        - name: QDRANT_HOST
          value: "qdrant"
        - name: PLANNER_URL
          value: "http://ollama.llms-ollama.svc.cluster.local:11434"
        - name: PLANNER_MODEL
          value: "granite3.1-dense:8b"
        - name: PLANNER_PROMPT_TYPE
          value: "granite31"
        - name: EXECUTOR_URL
          value: "http://ollama-code.llms-ollama.svc.cluster.local:11434"
        - name: EXECUTOR_MODEL
          value: "qwen3:32b"
        - name: EXECUTOR_PROMPT_TYPE
          value: "llama3"
        - name: EMBEDDING_URL
          value: "http://ollama-embed.llms-ollama.svc.cluster.local:11434"
        - name: EMBEDDING_MODEL
          value: "all-minilm:l6-v2"
        - name: ALT_PLANNER_URL
          value: "http://ollama-planner-cpu.llms-ollama.svc.cluster.local:11434"
        - name: ALT_PLANNER_MODEL
          value: "llama3.2:3b"
        - name: QDRANT_COLLECTION
          value: "vectors"
        - name: QDRANT_SEARCH_LIMIT
          value: "5"
        - name: QDRANT_SEARCH_TIMEOUT
          value: "30s"
        - name: RECURSION_BUDGET
          value: "2.0"
        - name: MEMORY_CONTROLLER_URL
          value: "https://memory-controller.rag-system.svc.cluster.local"
        - name: RAG_INGESTION_URL
          value: "https://rag-ingestion-service.rag-system.svc.cluster.local"
        - name: SSL_CERT_FILE
          value: "/etc/ssl/certs/ca-certificates.crt"
        - name: OTEL_USE_TLS
          value: "true"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "otel-collector.monitoring.svc.cluster.local:4317"
        - name: TLS_CERT
          value: "/etc/ssl/certs/tls.crt"
        - name: TLS_KEY
          value: "/etc/ssl/certs/tls.key"
        - name: MODEL_DEFAULTS_CONFIG_PATH
          value: "/etc/rag-worker/model-defaults.yaml"
        - name: PLANNER_MODEL_CONFIG_PATH
          value: "/etc/rag-worker/planner-model.yaml"
        - name: EXECUTOR_MODEL_CONFIG_PATH
          value: "/etc/rag-worker/executor-model.yaml"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: EMBED_FANOUT_ENABLED
          value: "false"
        volumeMounts:
        - name: registry-ca
          mountPath: /etc/ssl/certs/ca-certificates.crt
          subPath: ca.crt
        - name: service-tls
          mountPath: /etc/ssl/certs/tls.crt
          subPath: tls.crt
        - name: service-tls
          mountPath: /etc/ssl/certs/tls.key
          subPath: tls.key
        - name: model-defaults
          mountPath: /etc/rag-worker/model-defaults.yaml
          subPath: defaults.yaml
        - name: model-planner
          mountPath: /etc/rag-worker/planner-model.yaml
          subPath: model.yaml
        - name: model-executor
          mountPath: /etc/rag-worker/executor-model.yaml
          subPath: model.yaml
      volumes:
      - name: app-dir
        emptyDir: {}
      - name: registry-ca
        configMap:
          name: registry-ca-cm
      - name: service-tls
        secret:
          secretName: rag-worker-tls
          optional: true
      - name: model-defaults
        configMap:
          name: rag-worker-model-defaults
      - name: model-planner
        configMap:
          name: rag-worker-model-planner
      - name: model-executor
        configMap:
          name: rag-worker-model-executor
---
apiVersion: v1
kind: Service
metadata:
  name: rag-worker
  namespace: rag-system
  labels:
    app.kubernetes.io/part-of: rag-stack
spec:
  selector:
    app: rag-worker
  ports:
  - port: 8080
    targetPort: 8080
    name: health
