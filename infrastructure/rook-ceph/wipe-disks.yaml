# wipe-disks.yaml - zero Rook-Ceph candidate disks BEFORE OSDs exist.
#
# GUARDED: wipe-disks.sh refuses to run this while rook-ceph-osd deployments
# exist (FORCE_WIPE=true overrides). On 2026-09-14 an ungated re-run zeroed the
# LVM/BlueStore labels under five LIVE OSDs. See OPERATIONS.md 1.10.
#
# Device lists must match the node's real disks. `blockdev --getsize64` below is
# an existence probe as well as a size query: a device that does not exist is
# skipped. Without it, `dd of=/dev/vdX` on a missing device writes a regular
# FILE onto the container's 64MB /dev tmpfs, fills it, and fails the job --
# which is exactly how the phantom vde/vdf entries broke worker-0.
#
# busybox has no wipefs, so zeroing is the whole wipe. Both ends are cleared:
# the head takes the GPT primary header, LVM PV label and BlueStore superblock;
# the tail takes the GPT BACKUP header, which a head-only wipe leaves behind and
# which can make ceph-volume reject an otherwise clean disk.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: wipe-disks-worker-0
  namespace: rook-ceph
spec:
  template:
    spec:
      containers:
      - name: wipe
        image: hierophant.hierocracy.home:5000/busybox:1.36
        securityContext:
          privileged: true
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -e
            for d in vdb vdc vdd; do
              sz=$(blockdev --getsize64 "/dev/$d" 2>/dev/null) || {
                echo "SKIP /dev/$d: not present on worker-0"; continue; }
              echo "wiping /dev/$d ($sz bytes)"
              dd if=/dev/zero of="/dev/$d" bs=1M count=100
              tail_mb=$(( sz / 1048576 - 20 ))
              [ "$tail_mb" -gt 100 ] && \
                dd if=/dev/zero of="/dev/$d" bs=1M count=20 seek="$tail_mb"
            done
            echo "wipe complete on worker-0"
      nodeSelector:
        kubernetes.io/hostname: worker-0
      restartPolicy: Never
---
