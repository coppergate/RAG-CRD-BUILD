apiVersion: batch/v1
kind: Job
metadata:
  name: wipe-disks-worker-3
  namespace: rook-ceph
spec:
  template:
    spec:
      containers:
      - name: wipe
        image: hierophant.hierocracy.home:5000/busybox:1.36
        securityContext:
          privileged: true
        command: ["/bin/sh", "-c"]
        args:
          - |
            # worker-3 has the same layout as worker-0: vda(OS) vdb(HDD)
            # vdc(DB) vdd(NVMe). It had no wipe job at all until 2026-09-13,
            # while OPERATIONS.md 1.10 documented it as a 2-OSD node.
            wipefs -a /dev/vdb /dev/vdc /dev/vdd 2>/dev/null || true
            dd if=/dev/zero of=/dev/vdb bs=1M count=100
            dd if=/dev/zero of=/dev/vdc bs=1M count=100
            dd if=/dev/zero of=/dev/vdd bs=1M count=100
      nodeSelector:
        kubernetes.io/hostname: worker-3
      restartPolicy: Never
