#################################################################################################################
# Create a Ceph pool with settings for replication in production environments. A minimum of 3 OSDs on
# different hosts are required in this example.
#  kubectl create -f pool.yaml
#################################################################################################################

apiVersion: ceph.rook.io/v1
kind: CephBlockPool
metadata:
  name: ceph-replica-pool
  namespace: rook-ceph # namespace:cluster
spec:
  # The failure domain will spread the replicas of the data across different failure zones
  failureDomain: host
  # For a pool based on raw copies, specify the number of copies. A size of 1 indicates no redundancy.
  replicated:
    size: 3
    # Disallow setting pool with replica 1, this could lead to data loss without recovery.
    # Make sure you're *ABSOLUTELY CERTAIN* that is what you want
    requireSafeReplicaSize: true

    # hybridStorage:
    #   primaryDeviceClass: ssd
    #   secondaryDeviceClass: hdd
    # The number for replicas per failure domain, the value must be a divisor of the replica count. If specified, the most common value is 2 for stretch clusters, where the replica count would be 4.
    # replicasPerFailureDomain: 2
    # The name of the failure domain to place further down replicas
    # subFailureDomain: host
  # Ceph CRUSH root location of the rule
  # For reference: https://docs.ceph.com/docs/master/rados/operations/crush-map/#types-and-buckets
  #crushRoot: my-root
  # The Ceph CRUSH device class associated with the CRUSH replicated rule
  # For reference: https://docs.ceph.com/docs/master/rados/operations/crush-map/#device-classes
  # If device classes are specified, ensure this property is added to every pool in the cluster,
  # otherwise Ceph will warn about pools with overlapping roots.
  #deviceClass: my-class
  # allow rook to update pool spec and crush rule, use with caution, disabled by default
  #enableCrushUpdates: true
  # Enables collecting RBD per-image IO statistics by enabling dynamic OSD performance counters. Defaults to false.
  # For reference: https://docs.ceph.com/docs/master/mgr/prometheus/#rbd-io-statistics
  # enableRBDStats: true
  # Set any property on a given pool
  # see https://docs.ceph.com/docs/master/rados/operations/pools/#set-pool-values
  parameters:
    # pg_num: '512'
    # pgp_num: '512'
    pg_autoscale_mode: 'on'
    # Inline compression mode for the data pool
    # Further reference: https://docs.ceph.com/docs/master/rados/configuration/bluestore-config-ref/#inline-compression
    compression_mode: none
    # gives a hint (%) to Ceph in terms of expected consumption of the total cluster capacity of a given pool
    # for more info: https://docs.ceph.com/docs/master/rados/operations/placement-groups/#specifying-expected-pool-size
    #target_size_ratio: ".5"
  mirroring:
    enabled: false
    # mirroring mode: pool level or per image
    # for more details see: https://docs.ceph.com/docs/master/rbd/rbd-mirroring/#enable-mirroring
    mode: image
    # specify the schedule(s) on which snapshots should be taken
    # snapshotSchedules:
    #   - interval: 24h # daily snapshots
    #     startTime: 14:00:00-05:00
  # reports pool mirroring status if enabled
  statusCheck:
    mirror:
      disabled: false
      interval: 60s
  # quota in bytes and/or objects, default value is 0 (unlimited)
  # see https://docs.ceph.com/en/latest/rados/operations/pools/#set-pool-quotas
  # quotas:
  #   maxSize: "10Gi" # valid suffixes include k, M, G, T, P, E, Ki, Mi, Gi, Ti, Pi, Ei
  #   maxObjects: 1000000000 # 1 billion objects

---

#################################################################################################################
# NVMe fast-tier pool: backed by the TWO NVMe-only OSDs (worker-0 vdd, worker-3 vdd; 195GB each).
#
# Rewritten 2026-09-15. It previously carried size: 1 with deviceClass omitted and
# this comment:
#
#   "deviceClass intentionally omitted: KVM/QEMU VirtIO block devices are never
#    classified as 'nvme' by Ceph regardless of physical backing media."
#
# That is FALSE, and the combination made this pool strictly worse than
# ceph-replica-pool: no redundancy AND no NVMe placement. VirtIO does hide the
# rotational flag, so Ceph's AUTO-detection classes these devices hdd — but the
# per-device `deviceClass: nvme` in cluster.yaml overrides auto-detection, and
# does. Verified with `ceph osd tree`:
#
#   osd.4  nvme  worker-0      osd.5  nvme  worker-3
#
# Without deviceClass here, Rook built the rule as a bare `take default`, so the
# "nvme" pool placed PGs on the HDD OSDs — confirmed by `ceph pg ls-by-pool
# ceph-nvme-pool` showing UP [3] and [0], both hdd.
#
# size: 2 is the MAXIMUM possible: there are exactly two nvme OSDs, on two
# distinct hosts, and failureDomain is host. size 3 needs a third NVMe device.
# 195GB usable. Survives the loss of one host.
#################################################################################################################

apiVersion: ceph.rook.io/v1
kind: CephBlockPool
metadata:
  name: ceph-nvme-pool
  namespace: rook-ceph
spec:
  failureDomain: host
  replicated:
    size: 2
    # Back to true: this guard exists only to permit size 1, which we no longer use.
    requireSafeReplicaSize: true
  # Restricts the CRUSH rule to `take default class nvme`, which is what makes
  # this a fast tier rather than a name.
  deviceClass: nvme
  parameters:
    pg_autoscale_mode: 'on'
    compression_mode: none
